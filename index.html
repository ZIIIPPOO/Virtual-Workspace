<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <aside>
        <div class="staff-mem">
            <h1>Unassigned Staff</h1>
        <div class="mem">
            
        </div>
        </div>
        <button onclick="addWorkers()">Add New Worker</button>
    </aside>
    <main>
        <div class="zone conference">
            <p>Conference Room</p>
            <div class="assigned-list"></div>
            <button class="add-btn" onclick="assignWorkers(1)">+</button>
        </div>
        <div class="zone serveurs">
            <p>Servers Room</p>
            <div class="assigned-list"></div>
            <button class="add-btn" onclick="assignWorkers(2)">+</button>
        </div>
        <div class="zone securite">
            <p>Security Room</p>
            <div class="assigned-list"></div>
            <button class="add-btn" onclick="assignWorkers(3)">+</button>
        </div>
        <div class="zone reception">
            <p>Reception</p>
            <div class="assigned-list"></div>
            <button class="add-btn" onclick="assignWorkers(4)">+</button>
        </div>
        <div class="zone personnel">
            <p>Staff Room</p>
            <div class="assigned-list"></div>
            <button class="add-btn" onclick="assignWorkers(5)">+</button>
        </div>
        <div class="zone archives">
            <p>Vault</p>
            <div class="assigned-list"></div>
            <button class="add-btn" onclick="assignWorkers(6)">+</button>
        </div>

        <div class="overlay">
            <div class="modal">
                <div class="modal-header">
                    <h2>Add Worker</h2>
                    <button onclick="hideModal()" class="close-btn">✕</button>
                </div>

                <div class="modal-body">
                    <form id="workerForm">
                        <div class="form-group">
                            <label for="workerName">Name:</label>
                            <input type="text" id="workerName" placeholder="Enter full name">
                        </div>

                        <div class="form-group">
                            <label for="workerRole">Role:</label>
                            <select id="workerRole">
                                <option value="">-- Select Role --</option>
                                <option value="Receptionist">Receptionist</option>
                                <option value="IT Technician">IT Technician</option>
                                <option value="Security Agent">Security Agent</option>
                                <option value="Manager">Manager</option>
                                <option value="Cleaning">Cleaning</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="workerPhoto">Photo :</label>
                            <input oninput="previewPhoto()" type="url" id="workerPhoto" placeholder="https://example.com/photo.jpg">
                        </div>

                        <div class="photo-preview-section">
                            <div class="photo-preview">
                                <img src="images/img_placeholder.png" alt="">
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="workerEmail">Email:</label>
                            <input type="email" id="workerEmail" placeholder="example@email.com">
                        </div>

                        <div class="form-group">
                            <label for="workerPhone">Phone:</label>
                            <input type="tel" id="workerPhone" placeholder="+212 6XX XXX XXX">
                        </div>

                        <div class="experiences-section">
                            <h3>Experiences:</h3>
                            <button onclick="addExperience()" type="button" class="btn-add-exp">+ Add Experience</button>
                        </div>

                        <div class="modal-footer">
                            <button type="button" onclick="hideModal()" class="btn-cancel">Cancel</button>
                            <button type="submit" class="btn-save">Save</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
        <div class="assign-overlay">
            <div class="modal">
                <div class="modal-header assign">
                    <h2>Select worker to assign</h2>
                    <button onclick="hideAssignModal()" class="close-btn">✕</button>
                </div>
                <div class="modal-body bd">

                </div>
            </div>
        </div>

    </main>
</body>

</html>
