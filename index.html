<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <aside>
        <div class="staff-mem">
            <h1>Unassigned Staff</h1>
            </div>
        </div>
        <button onclick="addWorkers()">Add New Worker</button>
    </aside>
    <main>
        <div class="zone conference">
            <p>Conference Room</p>
            <button onclick="assignWorkers()">+</button>
        </div>
        <div class="zone serveurs">
            <p>Servers Room</p>
            <button onclick="assignWorkers()">+</button>
        </div>
        <div class="zone securite">
            <p>Security Room</p>
            <button onclick="assignWorkers()">+</button>
        </div>
        <div class="zone reception">
            <p>Reception</p>
            <button onclick="assignWorkers()">+</button>
        </div>
        <div class="zone personnel">
            <p>Staff Room</p>
            <button onclick="assignWorkers()">+</button>
        </div>
        <div class="zone archives">
            <p>Vault</p>
            <button onclick="assignWorkers()">+</button>
        </div>

        <div class="overlay">
            <div class="modal">
                <div class="modal-header">
                    <h2>Add Worker</h2>
                    <button onclick="hideModal()" class="close-btn">✕</button>
                </div>

                <div class="modal-body">
                    <form id="workerForm">
                        <div class="form-group">
                            <label for="workerName">Name:</label>
                            <input type="text" id="workerName" placeholder="Enter full name">
                        </div>

                        <div class="form-group">
                            <label for="workerRole">Role:</label>
                            <select id="workerRole">
                                <option value="">-- Select Role --</option>
                                <option value="Receptionist">Receptionist</option>
                                <option value="IT Technician">IT Technician</option>
                                <option value="Security Agent">Security Agent</option>
                                <option value="Manager">Manager</option>
                                <option value="Cleaning">Cleaning</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="workerPhoto">Photo (URL):</label>
                            <input type="url" id="workerPhoto" placeholder="https://example.com/photo.jpg">
                        </div>

                        <div class="photo-preview-section">
                            <div class="photo-preview">
                                <span class="photo-placeholder">👤</span>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="workerEmail">Email:</label>
                            <input type="email" id="workerEmail" placeholder="example@email.com">
                        </div>

                        <div class="form-group">
                            <label for="workerPhone">Phone:</label>
                            <input type="tel" id="workerPhone" placeholder="+212 6XX XXX XXX">
                        </div>

                        <div class="experiences-section">
                            <h3>Experiences:</h3>

                            <div class="experience-item">
                                <div class="form-group">
                                    <label>Company:</label>
                                    <input class="company" type="text" placeholder="Enter company">
                                </div>

                                <div class="form-group">
                                    <label>Role:</label>
                                    <input class="role" type="text" placeholder="Enter role">
                                </div>

                                <div class="date-group">
                                    <div class="form-group">
                                        <label>From:</label>
                                        <input class="from" type="date">
                                    </div>
                                    <div class="form-group">
                                        <label>To:</label>
                                        <input class="to" type="date">
                                    </div>
                                </div>

                                <button type="button" class="btn-remove">Remove</button>
                            </div>

                            <button type="button" class="btn-add-exp">+ Add Experience</button>
                        </div>

                        <div class="modal-footer">
                            <button type="button" onclick="hideModal()" class="btn-cancel">Cancel</button>
                            <button type="submit" class="btn-save">Save</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
        <div class="assign-overlay">
            <div class="modal">
                <div class="modal-header assign">
                    <h2>Select worker to assign</h2>
                    <button onclick="hideAssignModal()" class="close-btn">✕</button>
                </div>
                <div class="modal-body">
                    <div class="card">
                        <img src="images/background.jpg" alt="">
                        <div>
                            <h2>NAME</h2>
                            <p>role</p>
                        </div>
                        <button class="edit-button">Add</button>
                    </div>
                </div>
            </div>
        </div>

    </main>
</body>

</html>
